# .github/workflows/build-solutions.yml
# Rebuilds /solutions/ whenever a markdown file in _solutions/ changes.
# Source of truth: _solutions/*.md   Output (generated, don't edit): solutions/

name: Build solutions

on:
  push:
    branches: [main]
    paths:
      - "_solutions/**"
      - "_tools/build_solutions.py"
  workflow_dispatch:

concurrency:
  group: build-solutions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # needed so the action can commit back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install markdown==3.7 pyyaml==6.0.2

      - name: Build pages
        run: python _tools/build_solutions.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A solutions
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit"
          else
            git commit -m "chore: rebuild solutions"
            # The hourly problems.json job may have pushed in the meantime.
            git pull --rebase origin main
            git push
          fi
